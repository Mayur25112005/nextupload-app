<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NextUpload — what do you need?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0E1420;--surface:#161D2E;--line:#2A3550;--text:#F2EFE9;--muted:#9AA3B5;--amber:#F2A93B;--tally:#E4572E;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
  h1{font-family:'Space Grotesk',sans-serif;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;margin-bottom:36px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--tally);}
  h1{font-size:28px;margin:0 0 10px;text-align:center;}
  p.sub{color:var(--muted);margin:0 0 36px;text-align:center;max-width:40ch;}
  .cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:640px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:260px;text-decoration:none;color:var(--text);transition:border-color .15s ease, transform .15s ease;display:block;position:relative;}
  .card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .card .emoji{font-size:32px;margin-bottom:14px;}
  .card h3{font-size:18px;margin:0 0 8px;}
  .card p{color:var(--muted);font-size:13.5px;margin:0;}
  .card.disabled{opacity:.5;cursor:not-allowed;pointer-events:none;}
  .badge{position:absolute;top:14px;right:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:3px 8px;border-radius:20px;}
</style>
</head>
<body>
<div class="brand"><span class="dot"></span> NextUpload</div>
<h1>Aapko kya chahiye?</h1>
<p class="sub">Ek option chuno — hum aapke channel ke hisaab se sahi cheez dikhayenge.</p>
<div class="cards">
  <a href="idea.html" class="card">
    <div class="emoji">🎯</div>
    <h3>Next Video Idea</h3>
    <p>Apna channel link daalo, hum bata denge next video kya banayein — title, tags sab.</p>
  </a>
  <a href="#" class="card disabled">
    <span class="badge">Coming soon</span>
    <div class="emoji">🎨</div>
    <h3>Thumbnail Banao</h3>
    <p>Video title daalo, AI copyright-free thumbnail bana dega.</p>
  </a>
</div>
</body>
</html>
