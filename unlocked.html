<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NextUpload — Your Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0E1A;--surface:#161D2E;--surface-2:#1D263C;--line:#2A3550;
    --text:#F2EFE9;--muted:#9AA3B5;
    --c1:#F2A93B;--c2:#E4572E;--c3:#4FD1C5;--c4:#B07CF2;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 10% 6%, rgba(242,169,59,.14), transparent 30%),
      radial-gradient(circle at 92% 14%, rgba(176,124,242,.12), transparent 32%),
      radial-gradient(circle at 15% 90%, rgba(79,209,197,.1), transparent 32%),
      var(--ink);
    color:var(--text);font-family:'Inter',sans-serif;line-height:1.55;position:relative;overflow-x:hidden;
  }
  h1{font-family:'Space Grotesk',sans-serif;}
  a{color:var(--c1);}
  .wrap{max-width:720px;margin:0 auto;padding:40px 24px 60px;position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:26px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--c2);box-shadow:0 0 12px var(--c2);animation:blink 2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
  h1{font-size:28px;margin:0 0 8px;
    background:linear-gradient(90deg,var(--c1),var(--c2) 40%,var(--c4) 75%,var(--c3));
    -webkit-background-clip:text;background-clip:text;color:transparent;background-size:300% auto;animation:shine 7s linear infinite;}
  @keyframes shine{to{background-position:300% center;}}
  p.sub{color:var(--muted);margin:0 0 32px;font-size:14.5px;}

  .idea{
    border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px;
    background:rgba(22,29,46,.85);backdrop-filter:blur(6px);
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    animation:fadeUp .4s ease both;
  }
  .idea:hover{transform:translateY(-4px);border-color:var(--c1);box-shadow:0 14px 30px rgba(0,0,0,.35);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .idea .n{color:var(--c1);font-weight:600;font-size:13px;margin-bottom:8px;}
  .idea h3{font-size:19px;margin:0 0 10px;font-weight:600;}
  .idea .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .idea .tags span{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:4px 10px;border-radius:20px;}
  .idea .reason{color:var(--muted);font-size:14px;margin:0;}
  .empty{color:var(--muted);text-align:center;padding:60px 0;}

  .cta{margin-top:36px;text-align:center;}
  .cta a{display:inline-block;background:linear-gradient(135deg, var(--c1), #ffbb4d);color:#191204;font-weight:700;
    font-size:14px;padding:12px 26px;border-radius:10px;text-decoration:none;
    transition:transform .2s ease, box-shadow .2s ease;}
  .cta a:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(242,169,59,.35);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span> NextUpload</div>
  <h1>Your ideas are ready 🎉</h1>
  <p class="sub" id="channelLine">Loading…</p>
  <div id="ideasList"></div>
  <div class="cta"><a href="idea.html">Analyze another channel →</a></div>
</div>
<script>
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
const raw = localStorage.getItem('nu_unlocked_data');
const wrap = document.getElementById('ideasList');
const channelLine = document.getElementById('channelLine');
if(!raw){
  channelLine.textContent = '';
  wrap.innerHTML = '<div class="empty">No unlocked ideas found. <a href="idea.html">Go back and analyze your channel</a>.</div>';
}else{
  const data = JSON.parse(raw);
  channelLine.innerHTML = `<b>${escapeHtml(data.channelTitle)}</b> — ${data.ideas.length} ideas based on ${Number(data.subscribers).toLocaleString('en-IN')} subscribers.`;
  data.ideas.forEach((idea,i)=>{
    const tags = (idea.tags||[]).map(t=>`<span>#${escapeHtml(String(t).replace(/^#/,''))}</span>`).join('');
    const div = document.createElement('div');
    div.className='idea';
    div.style.animationDelay = (i*0.07)+'s';
    div.innerHTML = `<div class="n">IDEA ${i+1}</div><h3>${escapeHtml(idea.title||'Untitled idea')}</h3><div class="tags">${tags}</div><p class="reason">${escapeHtml(idea.reason||'')}</p>`;
    wrap.appendChild(div);
  });
}
</script>
</body>
</html>
