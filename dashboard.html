<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NextUpload — Dashboard</title>
<style>
  :root{--ink:#0E1420;--surface:#161D2E;--line:#2A3550;--text:#F2EFE9;--muted:#9AA3B5;--amber:#F2A93B;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--text);font-family:sans-serif;padding:40px 20px;}
  .wrap{max-width:600px;margin:0 auto;}
  h1{font-size:26px;margin-bottom:6px;}
  p.sub{color:var(--muted);margin-top:0;margin-bottom:26px;}
  button{background:var(--amber);color:#191204;border:none;border-radius:9px;padding:11px 20px;font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:26px;}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;}
  .stat .label{color:var(--muted);font-size:13px;margin-bottom:8px;}
  .stat .value{font-size:26px;font-weight:700;color:var(--amber);}
  @media (max-width:500px){.stats{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>NextUpload Dashboard</h1>
  <p class="sub">Live visits, payments &amp; earnings.</p>
  <button id="fetchBtn">Refresh</button>
  <div class="stats">
    <div class="stat"><div class="label">Total Visits</div><div class="value" id="visits">—</div></div>
    <div class="stat"><div class="label">Total Payments</div><div class="value" id="payments">—</div></div>
    <div class="stat"><div class="label">Total Earnings</div><div class="value" id="earnings">—</div></div>
  </div>
</div>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxHpCT_GMVGmJimn1274Bo_Rwo3TtwVdcsWEMkpQIDKECrXDT0s7jSyR7hIuyoH_8iv/exec";
async function loadStats(){
  document.getElementById('fetchBtn').textContent = 'Loading...';
  try{
    const res = await fetch(GAS_URL);
    const data = await res.json();
    document.getElementById('visits').textContent = data.visits;
    document.getElementById('payments').textContent = data.payments;
    document.getElementById('earnings').textContent = '₹' + data.earnings;
  }catch(e){
    alert('Fetch failed, try again.');
  }
  document.getElementById('fetchBtn').textContent = 'Refresh';
}
document.getElementById('fetchBtn').addEventListener('click', loadStats);
loadStats();
</script>
</body>
</html>
